<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS 5.0</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  padding: 25px 15px;
  background: radial-gradient(circle at center, #102638, #02060b 75%);
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

.app {
  max-width: 480px;
  margin: auto;
}

h1 {
  color: #00d9ff;
  letter-spacing: 7px;
  text-shadow: 0 0 15px #00bfff;
}

.subtitle {
  color: #80aabd;
  font-size: 11px;
  letter-spacing: 4px;
}

.status {
  margin-top: 25px;
  color: #00ffae;
  font-size: 12px;
  letter-spacing: 3px;
}

.reactor {
  width: 210px;
  height: 210px;
  margin: 30px auto;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  animation: pulse 2s infinite alternate;
}

.reactor svg {
  width: 155px;
  height: 155px;
  filter: drop-shadow(0 0 15px #00dfff);
  z-index: 2;
}

.heart-outline {
  fill: #071c2a;
  stroke: #00d9ff;
  stroke-width: 4;
}

.heart-core {
  fill: #00d9ff;
  filter: drop-shadow(0 0 12px #00dfff);
  animation: glow 1.5s infinite alternate;
}

.ring {
  position: absolute;
  inset: 5px;
  border: 2px solid rgba(0,217,255,.5);
  border-radius: 50%;
  animation: rotate 8s linear infinite;
}

.ring-inner {
  position: absolute;
  inset: 20px;
  border: 1px dashed rgba(0,217,255,.5);
  border-radius: 50%;
  animation: rotate 12s linear infinite reverse;
}

@keyframes pulse {
  to { transform: scale(1.06); }
}

@keyframes glow {
  to { opacity: .55; }
}

@keyframes rotate {
  to { transform: rotate(360deg); }
}

.panel {
  background: rgba(13,27,40,.9);
  border: 1px solid #087eaa;
  border-radius: 15px;
  padding: 18px;
  margin-top: 18px;
  box-shadow: 0 0 18px rgba(0,191,255,.12);
}

.panel-title {
  color: #00d9ff;
  letter-spacing: 3px;
  font-size: 12px;
}

#reply {
  color: #9beeff;
  min-height: 48px;
  line-height: 1.6;
  margin-top: 15px;
}

#heard {
  color: #00ffae;
  min-height: 25px;
  font-size: 13px;
}

select {
  width: 100%;
  padding: 13px;
  margin-top: 12px;
  background: #08131d;
  color: white;
  border: 1px solid #087eaa;
  border-radius: 10px;
  font-size: 15px;
}

button {
  background: #087eaa;
  color: white;
  padding: 14px 18px;
  margin: 8px 3px;
  border: none;
  border-radius: 10px;
  font-size: 14px;
  cursor: pointer;
}

button:active {
  transform: scale(.96);
}

.mic {
  background: #008f68;
}

.stop {
  background: #a52a2a;
}

.footer {
  margin-top: 28px;
  color: #52798b;
  font-size: 10px;
  letter-spacing: 2px;
}
</style>
</head>
<body>
<div class="app">

  <h1>J.A.R.V.I.S</h1>
  <div class="subtitle">PERSONAL AI INTERFACE</div>

  <div class="status" id="status">SYSTEM ONLINE</div>

  <div class="reactor">
    <div class="ring"></div>
    <div class="ring-inner"></div>

    <svg viewBox="0 0 200 200" aria-label="Heart shaped reactor">
      <path class="heart-outline"
        d="M100 175 C80 155 25 115 25 70 C25 25 80 15 100 55 C120 15 175 25 175 70 C175 115 120 155 100 175 Z"/>
      <path class="heart-core"
        d="M100 145 C82 128 48 101 48 72 C48 48 78 42 100 75 C122 42 152 48 152 72 C152 101 118 128 100 145 Z"/>
    </svg>
  </div>

  <div class="panel">
    <div class="panel-title">JARVIS RESPONSE</div>
    <div id="reply">Hello. I am JARVIS. How can I help you?</div>
  </div>

  <div class="panel">
    <div class="panel-title">VOICE RECOGNITION</div>
    <div id="heard">Waiting for your command...</div>

    <select id="language">
      <option value="en-IN">English</option>
      <option value="ta-IN">தமிழ்</option>
    </select>

    <button class="mic" onclick="startListening()">🎙 START LISTENING</button>
    <button class="stop" onclick="stopListening()">STOP</button>
  </div>

  <div class="footer">STARK TECHNOLOGY • JARVIS 5.0</div>
</div>
<script>
const replyBox = document.getElementById("reply");
const heardBox = document.getElementById("heard");
const statusBox = document.getElementById("status");
const languageSelect = document.getElementById("language");

const SpeechRecognition =
  window.SpeechRecognition || window.webkitSpeechRecognition;

let recognition;
let listening = false;

function speak(message) {
  if (!("speechSynthesis" in window)) return;

  window.speechSynthesis.cancel();

  const speech = new SpeechSynthesisUtterance(message);
  speech.lang = languageSelect.value;
  speech.rate = 0.95;
  speech.pitch = 1;

  window.speechSynthesis.speak(speech);
}

function respond(message, shouldSpeak = true) {
  replyBox.textContent = message;
  if (shouldSpeak) speak(message);
}

function handleCommand(command) {
  const text = command.toLowerCase().trim();
  const isTamil = languageSelect.value === "ta-IN";

  if (
    text.includes("hello") ||
    text.includes("hi") ||
    text.includes("வணக்கம்") ||
    text.includes("ஹலோ")
  ) {
    respond(isTamil
      ? "வணக்கம்! நான் ஜார்விஸ். உங்களுக்கு எப்படி உதவலாம்?"
      : "Hello! I am JARVIS. How can I help you?");
  }

  else if (
    text.includes("your name") ||
    text.includes("who are you") ||
    text.includes("உன் பெயர்") ||
    text.includes("யார் நீ")
  ) {
    respond(isTamil
      ? "நான் ஜார்விஸ். உங்கள் தனிப்பட்ட உதவியாளர்."
      : "I am JARVIS, your personal assistant.");
  }

  else if (
    text.includes("time") ||
    text.includes("நேரம்")
  ) {
    const time = new Date().toLocaleTimeString(
      isTamil ? "ta-IN" : "en-IN",
      { hour: "numeric", minute: "2-digit" }
    );

    respond(isTamil
      ? "இப்போது நேரம் " + time
      : "The current time is " + time);
  }

  else if (
    text.includes("date") ||
    text.includes("today") ||
    text.includes("தேதி") ||
    text.includes("இன்று")
  ) {
    const date = new Date().toLocaleDateString(
      isTamil ? "ta-IN" : "en-IN",
      { day: "numeric", month: "long", year: "numeric" }
    );

    respond(isTamil
      ? "இன்றைய தேதி " + date
      : "Today's date is " + date);
  }

  else if (
    text.includes("how are you") ||
    text.includes("நலமா") ||
    text.includes("எப்படி இருக்க")
  ) {
    respond(isTamil
      ? "நான் நன்றாக இருக்கிறேன். உங்களுக்கு உதவ தயாராக இருக்கிறேன்."
      : "I am doing great. Always ready to help you.");
  }

  else if (
    text.includes("thank you") ||
    text.includes("thanks") ||
    text.includes("நன்றி")
  ) {
    respond(isTamil
      ? "உங்களுக்கு உதவுவதில் மகிழ்ச்சி."
      : "You are welcome. Happy to help.");
  }

  else if (
    text.includes("help") ||
    text.includes("உதவி")
  ) {
    respond(isTamil
      ? "வணக்கம், நேரம், தேதி, உன் பெயர், எப்படி இருக்கிறாய் போன்ற கேள்விகளைக் கேட்கலாம்."
      : "You can ask me about the time, date, my name, or say hello.");
  }

  else if (
    text.includes("stop speaking") ||
    text.includes("பேசாதே")
  ) {
    window.speechSynthesis.cancel();
    respond(isTamil ? "சரி." : "Okay.", false);
  }

  else {
    respond(isTamil
      ? "மன்னிக்கவும், அந்த command எனக்குப் புரியவில்லை. மீண்டும் சொல்லுங்கள்."
      : "Sorry, I did not understand that command. Please try again.");
  }
}

function startListening() {
  if (!SpeechRecognition) {
    respond("Speech recognition is not supported in this browser.");
    return;
  }

  if (recognition) {
    recognition.stop();
  }

  recognition = new SpeechRecognition();
  recognition.lang = languageSelect.value;
  recognition.continuous = false;
  recognition.interimResults = false;

  recognition.onstart = function() {
    listening = true;
    statusBox.textContent = "LISTENING...";
    heardBox.textContent = "Listening to your voice...";
  };

  recognition.onresult = function(event) {
    const command = event.results[0][0].transcript;
    heardBox.textContent = "You said: " + command;
    handleCommand(command);
  };

  recognition.onerror = function(event) {
    heardBox.textContent = "Error: " + event.error;
    statusBox.textContent = "SYSTEM ONLINE";
  };

  recognition.onend = function() {
    listening = false;
    statusBox.textContent = "SYSTEM ONLINE";
  };

  recognition.start();
}

function stopListening() {
  if (recognition && listening) {
    recognition.stop();
  }

  window.speechSynthesis.cancel();
  listening = false;
  statusBox.textContent = "SYSTEM ONLINE";
  heardBox.textContent = "Listening stopped.";
}

languageSelect.addEventListener("change", function() {
  if (recognition && listening) {
    recognition.stop();
  }
});

</script>
</body>
</html>
